<div class="table">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
      <td mat-cell *matCellDef="let element" class="email">
        <span>
          {{element.email}}
        </span>
        <button mat-icon-button (click)="remove(element.id)"
        ><mat-icon>close</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
<form (submit)="onSubmit()" [formGroup]="addForm" class="add-container">
  <mat-form-field>
    <input matInput formControlName="name" placeholder="Nom" (keyup)="applyFilter($event)">
    @if (addForm.get('name')?.value) {
      <button matSuffix mat-icon-button aria-label="Clear" (click)="addForm.get('name')?.patchValue('')">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
  <button mat-raised-button type="submit" [disabled]="addForm.invalid">Ajouter</button>
</form>
