<button mat-fab [matMenuTriggerFor]="animals">
    <mat-icon>blur_on</mat-icon>
</button>

<mat-menu #animals="matMenu">
    <button mat-menu-item [matMenuTriggerFor]="apps" *ngIf="Apps.length > 0">
        <mat-icon>apps</mat-icon>
        Apps
    </button>
    <button mat-menu-item [matMenuTriggerFor]="account">
        <mat-icon>person</mat-icon>
        mon compte
    </button>
</mat-menu>

<mat-menu #apps="matMenu">
  @for (app of Apps; track $index) {
    <a mat-menu-item [href]="app.url">
        <mat-icon>{{app.icon}}</mat-icon>
        {{app.name}}
    </a>
  }
</mat-menu>

<mat-menu #account="matMenu">
    <a mat-menu-item [href]="urlParams" >
        <mat-icon>settings</mat-icon>
        Paramètres
    </a>
    <button mat-menu-item (click)="onLogoutClick()">
        <mat-icon>logout</mat-icon>
        Déconnexion
    </button>
</mat-menu>
